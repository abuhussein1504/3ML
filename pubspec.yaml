name: make_my_money_last
description: Make My Money Last (3ML) - Smart Personal Budgeting
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.2

  path: ^1.9.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  intl: ^0.19.0
  fl_chart: ^0.68.0
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  uuid: ^4.4.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
